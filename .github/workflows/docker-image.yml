name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Git Semantic Version
      uses: PaulHatch/semantic-version@v4.0.3
      with:
        major_pattern: "major:"
        minor_pattern: "feat:"
        format: "${major}.${minor}.${patch}-prereleases${increment}"
      id: version
        

    - name: Docker login
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
   
      run: |
        # echo "Iniciando login"
        docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
        echo "New version: $NEW_VERSION!!!!!!!!"
        # echo "Fin del login"
    
    - name: Build the Docker image
      env:
        NEW_VERSION: ${{ steps.version.outputs.version }}
      run: |
        docker build --file Dockerfile --tag diegomamtz/docker-graphql:$NEW_VERSION .
        docker build --file Dockerfile --tag diegomamtz/docker-graphql:latest .
    # --tag my-image-name:$(date +%s)
    - name: Push the docker image
      env:
        NEW_VERSION: ${{ steps.version.outputs.version }}
      run: |
        docker push diegomamtz/docker-graphql:$NEW_VERSION
        docker push diegomamtz/docker-graphql:latest
